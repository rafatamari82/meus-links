<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-label="Mico curioso com uma lupa">
  <defs>
    <g id="mane">
      <circle cx="130" cy="104" r="70"/>
      <circle cx="74" cy="80" r="22"/><circle cx="186" cy="80" r="22"/>
      <circle cx="66" cy="118" r="22"/><circle cx="194" cy="118" r="22"/>
      <circle cx="84" cy="152" r="20"/><circle cx="176" cy="152" r="20"/>
      <circle cx="100" cy="46" r="20"/><circle cx="160" cy="46" r="20"/><circle cx="130" cy="36" r="20"/>
    </g>
  </defs>
  <!-- tail -->
  <path d="M170 220c38 6 62-18 56-48-4-20-28-26-38-12-8 11 3 23 13 16" fill="none" stroke="#3a2416" stroke-width="18" stroke-linecap="round"/>
  <path d="M170 220c38 6 62-18 56-48-4-20-28-26-38-12-8 11 3 23 13 16" fill="none" stroke="#f08a16" stroke-width="10" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="130" cy="202" rx="52" ry="44" fill="#f08a16" stroke="#3a2416" stroke-width="5"/>
  <ellipse cx="130" cy="214" rx="30" ry="24" fill="#f9c871"/>
  <!-- mane: outline first, then fill on top so only the outer edge shows -->
  <use href="#mane" fill="#3a2416" stroke="#3a2416" stroke-width="10"/>
  <use href="#mane" fill="#f08a16"/>
  <g fill="#ffb24a"><circle cx="112" cy="56" r="10"/><circle cx="152" cy="54" r="8"/><circle cx="80" cy="104" r="8"/><circle cx="184" cy="128" r="7"/></g>
  <!-- face -->
  <ellipse cx="130" cy="112" rx="42" ry="46" fill="#5b3a26" stroke="#3a2416" stroke-width="4"/>
  <ellipse cx="130" cy="136" rx="26" ry="18" fill="#8f5d3e"/>
  <!-- left eye -->
  <ellipse cx="110" cy="104" rx="11" ry="12" fill="#fff"/>
  <circle cx="112" cy="106" r="6" fill="#1d1d1d"/><circle cx="114" cy="103" r="2" fill="#fff"/>
  <!-- nose and smile -->
  <ellipse cx="130" cy="128" rx="5" ry="3.5" fill="#2b1a10"/>
  <path d="M118 140q12 10 24 0" fill="none" stroke="#2b1a10" stroke-width="3" stroke-linecap="round"/>
  <!-- arm up to the magnifier handle -->
  <path d="M166 200c20-6 28-20 28-38" fill="none" stroke="#3a2416" stroke-width="24" stroke-linecap="round"/>
  <path d="M166 200c20-6 28-20 28-38" fill="none" stroke="#f08a16" stroke-width="16" stroke-linecap="round"/>
  <!-- handle from the lens to the hand -->
  <path d="M170 124 L192 158" stroke="#3a2416" stroke-width="14" stroke-linecap="round"/>
  <path d="M170 124 L192 158" stroke="#7a4a2a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="194" cy="160" r="11" fill="#f08a16" stroke="#3a2416" stroke-width="4"/>
  <!-- magnifier over the right eye: the eye looks big through the lens -->
  <circle cx="150" cy="102" r="30" fill="#d6f0fa" stroke="#2f2f2f" stroke-width="7"/>
  <ellipse cx="150" cy="104" rx="19" ry="20" fill="#fff"/>
  <circle cx="153" cy="107" r="10" fill="#1d1d1d"/><circle cx="157" cy="102" r="3.5" fill="#fff"/>
  <path d="M132 88a24 24 0 0 1 13-9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
</svg>
